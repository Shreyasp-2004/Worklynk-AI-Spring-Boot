spring:
  application:
    name: worklynk-ai
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/worklynkjava
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
          model: llama3.2:3b
          temperature: 0.0
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true